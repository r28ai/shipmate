[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipmate"
version = "0.1.0"
description = "Your own personal agent, on your laptop. Gmail, Calendar, Slack, GitHub, Linear, Notion and more, with your keys and no middleman."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["agent", "personal-agent", "llm", "gmail", "langchain", "charter"]
dependencies = [
    "charter-ai[langchain]>=0.2.7",
    "langchain>=1.4",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.0"]

[project.scripts]
shipmate = "shipmate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/shipmate"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
